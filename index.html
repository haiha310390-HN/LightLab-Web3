<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>LightLAB Web 3</title>
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F5F63">
<style>
:root{--bg:#EEDEC4;--ink:#3B2F22;--acc:#1F5F63;--card:#F8F0DF;--track:#D8C3A0;--hint:#7D6A52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden}
#stage{flex:1;min-height:0;background:#1d1812 url(assets/bg.jpg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;position:relative;padding-top:env(safe-area-inset-top)}
#cv{display:none;box-shadow:0 2px 18px #0009;max-width:100%;max-height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#tag{position:absolute;left:8px;top:calc(52px + env(safe-area-inset-top));background:#000a;color:#fff;padding:3px 8px;border-radius:10px;font-size:12px;display:none}
#msg{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:4px 12px;border-radius:12px;font-size:12px;display:none;white-space:nowrap}
#panel{background:var(--card);border-top:1px solid var(--track);padding:8px 14px;max-height:38dvh;overflow-y:auto;display:none}
.row{margin:4px 0 8px}.row .h{display:flex;justify-content:space-between;font-size:13px}
.row .h b{color:var(--acc);font-weight:600}.row .h span{cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc);height:28px;margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;border:1px solid var(--track);background:#fff8;color:var(--ink);padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 18px;border-radius:10px;font-size:15px;width:100%;margin-top:4px}
.hint{color:var(--hint);font-size:12px;margin:2px 0 6px}
#strip{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;background:var(--bg);border-top:1px solid var(--track);padding:6px 6px calc(6px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.ic{flex:none;width:68px;scroll-snap-align:start;text-align:center;padding:4px 2px;border-radius:12px;cursor:pointer;border:2px solid transparent}
.ic img{width:48px;height:48px;object-fit:contain;display:block;margin:0 auto 2px;pointer-events:none}
.ic span{font-size:10.5px;line-height:1.15;display:block;min-height:24px}
.ic.on{background:var(--card);border-color:var(--acc)}
.ic.mod::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin:-2px auto 0}
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 18px;background:linear-gradient(#0008,#0000);z-index:5;pointer-events:none}
#top>*{pointer-events:auto}#top img{width:34px;height:34px;border-radius:8px}
#top b{color:#fff;font-size:15px;text-shadow:0 1px 3px #000a;flex:1}
#top select,#top button{background:#000a;color:#fff;border:1px solid #fff5;border-radius:10px;padding:6px 8px;font-size:13px}
#chat{position:fixed;left:0;right:0;bottom:var(--kb,0px);max-height:calc(var(--vh,100dvh)*.72);touch-action:manipulation;-webkit-user-select:text;user-select:text;background:var(--card);border-top:2px solid var(--acc);display:none;flex-direction:column;z-index:30}
#log{flex:1;overflow-y:auto;padding:8px 12px;min-height:70px}
.m{margin:4px 0;padding:6px 10px;border-radius:12px;white-space:pre-wrap;max-width:90%;overflow-wrap:anywhere}
.m.u{background:var(--acc);color:#fff;margin-left:auto}.m.a{background:#fff;border:1px solid var(--track)}
#cset{display:none;padding:8px 12px;border-bottom:1px solid var(--track);font-size:12px;color:var(--hint)}
#cset label{display:block;margin:4px 0 2px}
#cset input,#cbar input[type=text]{width:100%;border:1px solid var(--track);border-radius:10px;padding:7px 10px;font-size:16px;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink)}
#cbar{display:flex;align-items:center;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--track)}
#cbar input[type=text]{flex:1;min-width:0;border-radius:18px;padding:9px 14px}
#cbar button{background:var(--acc);color:#fff;border:0;border-radius:18px;padding:9px 14px;font-size:14px}
#cbar #gear{background:none;color:var(--ink);padding:6px;font-size:18px}
#attl{display:flex;align-items:center;gap:6px;padding:0 12px 4px;font-size:12px;color:var(--hint)}
.ptabs{display:flex;gap:6px;margin-bottom:8px}
.ptab{flex:1;text-align:center;padding:7px 4px;border-radius:10px;border:1px solid var(--track);background:#fff8;font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ptab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.star{flex:none;border:0;background:#fff;color:#c9b99a;border-radius:16px;width:34px;height:32px;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 0 0 2px #f2b84b}
.star.on{color:#f5b301}
#cset select{width:100%;border:1px solid var(--track);border-radius:10px;padding:7px 10px;font-size:16px;background:#fff;color:var(--ink)}
#gmref{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:0 14px;font-size:18px}
#panel .plist{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pt{flex:none;width:96px;position:relative;text-align:center;scroll-snap-align:start;touch-action:pan-x;cursor:pointer}
.pt .im{width:96px;height:72px;border-radius:8px;border:3px solid transparent;box-sizing:border-box;background:#0002 center/cover no-repeat;position:relative}
.pt .im.bad::after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:#0006;border-radius:5px}
.pt.on .im{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pt .nm{font-size:11px;line-height:1.2;margin-top:3px;height:26px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.pt.on .nm{color:var(--acc);font-weight:600}
.pt .star{position:absolute;right:5px;top:5px;width:30px;height:30px;border-radius:50%;padding:0;font-size:18px;box-shadow:0 0 0 2px #f2b84b,0 1px 4px #0006}
.plist .hint{flex:none;align-self:center;max-width:260px}
</style>
</head>

  if(mixed(base))throw new Error(t('Trình duyệt chặn trang HTTPS gọi tới địa chỉ HTTP ngoài máy này. Dùng http://localhost trên chính máy chạy Ollama, hoặc một đường hầm HTTPS (Tailscale / Cloudflare Tunnel).'));
  const sm={role:'system',content:sys};
  let {r,j}=await chatCall(base,key,model,[sm,...hist,{role:'user',content}]),note='';
  if(!r.ok&&Array.isArray(content)&&/image|vision|multimodal/i.test(JSON.stringify(j.error||j))){note=t('Mô hình này không đọc được ảnh nên chỉ gửi văn bản.')+'\n\n';({r,j}=await chatCall(base,key,model,[sm,...hist,{role:'user',content:q}]))}
  if(!r.ok){const em=j.error&&(j.error.message||j.error)||'';let m=r.status+' '+(typeof em==='string'?em:JSON.stringify(em));
   if(r.status===401||r.status===403){const f=foreign(key);m+='\n'+(f?t('Khóa này thuộc {x}, không dùng được với Llama. Hãy dùng khóa của nhà cung cấp đã chọn.').replace('{x}',f):t('Khóa bị từ chối. Kiểm tra: khóa đúng nhà cung cấp đã chọn trong ⚙, không thừa ký tự, còn hiệu lực.'))+'\n['+base+']'}
   if(P.local&&r.status===404)m+='\n'+t('Mô hình chưa được tải: chạy "ollama pull <tên>" hoặc bấm ↻ để chọn mô hình đã cài.');
   throw new Error(m)}
  const a=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'…',at=typeof a==='string'?a:JSON.stringify(a);
  w.textContent=note+at;hist.push({role:'user',content:q},{role:'assistant',content:at});if(hist.length>20)hist.splice(0,2);
 }catch(e){w.textContent=t('Lỗi')+': '+e.message}
 busy=false;$('log').scrollTop=1e9;
}
$('csend').onclick=ask;$('cin').onkeydown=e=>{if(e.key=='Enter')ask()};
applyLang();
